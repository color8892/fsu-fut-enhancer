# H7: Signed beta / update workflow skeleton.
# Requires external secrets — without them this workflow only dry-runs validation.
#
# Required secrets (NOT present by default):
#   APPLE_CERTIFICATE_P12_BASE64
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD  (notarization)
#   WINDOWS_CERTIFICATE_P12_BASE64
#   WINDOWS_CERTIFICATE_PASSWORD
#   UPDATE_CHANNEL_SIGNING_KEY  (manifest signing)
#
# Status: blocked by external credentials. Do NOT claim signed/notarized release
# until secrets exist and a successful run is recorded.

name: Companion Signed Beta (skeleton)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip signing when secrets are missing (default true)"
        required: false
        default: "true"
  push:
    tags:
      - "companion-v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_apple: ${{ steps.secrets.outputs.has_apple }}
      has_windows: ${{ steps.secrets.outputs.has_windows }}
    steps:
      - id: secrets
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$APPLE_CERT" ]; then echo "has_apple=true" >> "$GITHUB_OUTPUT"; else echo "has_apple=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$WIN_CERT" ]; then echo "has_windows=true" >> "$GITHUB_OUTPUT"; else echo "has_windows=false" >> "$GITHUB_OUTPUT"; fi
          echo "H7 external gate: Apple cert present=$( [ -n \"$APPLE_CERT\" ] && echo yes || echo no )"
          echo "H7 external gate: Windows cert present=$( [ -n \"$WIN_CERT\" ] && echo yes || echo no )"

  macos-signed:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: companion
      - run: npm ci
        working-directory: extension
      - run: npm run package:runtime && npm run check:acl && npm run check:runtime
        working-directory: companion
      - run: npm run build
        working-directory: companion
      - name: Build unsigned app (always)
        working-directory: companion
        run: npm run tauri build -- --bundles app,dmg
      - name: Sign + notarize (only when secrets exist)
        if: needs.prepare.outputs.has_apple == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          echo "TODO: import cert, codesign --options runtime, notarytool submit, staple"
          echo "Blocked until release engineering wires Apple tooling."
          exit 1
      - name: Report blocked when secrets missing
        if: needs.prepare.outputs.has_apple != 'true'
        run: |
          echo "::notice::H7 macOS signed beta BLOCKED by missing Apple Developer ID / notarization secrets."
          echo "Unsigned artifact may still be built by companion.yml CI."

  windows-signed:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: companion
      - run: npm run package:runtime && npm run check:acl
        working-directory: companion
      - run: npm run build
        working-directory: companion
      - name: Build NSIS (unsigned)
        working-directory: companion
        run: npm run tauri build -- --bundles nsis
      - name: Sign installer (only when secrets exist)
        if: needs.prepare.outputs.has_windows == 'true'
        run: |
          echo "TODO: signtool sign with Windows code-signing certificate"
          exit 1
      - name: Report blocked when secrets missing
        if: needs.prepare.outputs.has_windows != 'true'
        shell: bash
        run: |
          echo "::notice::H7 Windows signed beta BLOCKED by missing code-signing certificate secrets."

  update-channel:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Update channel status: not_configured"
          echo "When signing is available: publish signed manifest with SHA-256 + rollback policy."
          echo "Downgrade policy: refuse unsigned / older-channel artifacts."
