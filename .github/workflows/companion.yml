name: Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            extension/package-lock.json
            shared/protocol/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: shared/protocol
      - run: npm ci
        working-directory: companion
      - run: npm ci
        working-directory: extension
      - run: npm run lint
        working-directory: companion
      - run: npm run package:runtime
        working-directory: companion
      - run: npm run check:acl
        working-directory: companion
      - run: npm run check:runtime
        working-directory: companion
      - name: Rust fmt + clippy
        working-directory: companion
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm test
        working-directory: companion
      - name: Extension gates
        working-directory: extension
        run: |
          npm run lint
          npm run typecheck
          npm run test:all
          npm run package
      - run: npm run build
        working-directory: companion
      - name: Tauri release-shaped bundle (unsigned)
        working-directory: companion
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: macOS bundle verify (ad-hoc ok)
        if: runner.os == 'macOS'
        working-directory: companion
        run: npm run check:bundle:macos
      - name: Windows installer clean install/uninstall smoke
        if: runner.os == 'Windows'
        working-directory: companion
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq '.exe' -and $_.Name -match 'setup' }
          $installer = $candidates | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw "No NSIS setup executable found under src-tauri/target/release/bundle/nsis" }
          Write-Host "Using installer: $($installer.FullName) size=$($installer.Length)"
          # Clean install + uninstall. Upgrade is NOT claimed here (single artifact per job).
          & .\scripts\windows-install-smoke.ps1 -InstallerPath $installer.FullName
      - name: macOS verifier unit tests
        if: runner.os == 'macOS'
        working-directory: companion
        run: node scripts/verify-macos-bundle.test.cjs
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v7
        with:
          name: companion-${{ matrix.os }}-${{ matrix.bundle }}
          path: |
            companion/src-tauri/target/release/bundle/**
          if-no-files-found: warn
